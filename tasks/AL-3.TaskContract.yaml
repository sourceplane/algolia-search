apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: AL-3
  title: "algolia-search becomes an Orun baseline"
spec:
  goal: blueprint.yaml and repo-blueprint.yaml take a new product from nothing to live on stage and prod in one landing (Supabase, then Hyperdrive, then the migrations, then the app), branded as its own, its schema and demo products applied before the app serves and shut to Supabase's Data API, its Algolia keys never in a build, held by Baseline CI
  affects:
    - blueprint.yaml
    - repo-blueprint.yaml
    - BOOTSTRAP.md
    - .baseline
    - .github/workflows/baseline.yml
    - .github/workflows/tag.yml
    - ai/context
    - docs/phases
    - hooks
    - testing
    - tooling/rebrand
    - tooling/bootstrap
    - tooling/catalog
    - apps/web/docs
    - packages/db/docs
    - infra
    - tests/web/docs
    - tests/db/docs
    - specs/epics/algolia-search
    - README.md
  doneWhen:
    - every Baseline CI tier is green
    - the product's own push-to-main plan orders supabase → cloudflare-hyperdrive → db-migrate → web, enforced
    - a product placed from it carries the product only, branded, with the upstream template's links and Algolia's own key names unrenamed
  gates: []
