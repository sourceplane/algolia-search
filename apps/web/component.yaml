apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The product search site, Algolia's InstantSearch over a Supabase products table (Next.js on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest and its sources declare.
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  # `app`, not `web`: a domain and a component share one name space in the
  # catalog, and a domain called `web` hid this component from it.
  domain: app
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  # INFRA BEFORE APP, ENFORCED ON MAIN. A merge to main converges the whole
  # product in one run: the Supabase project, then the Hyperdrive config over
  # its database, then the migrations, then this Worker. Its deploy reads the
  # Hyperdrive id (WIRING_CLOUDFLARE_HYPERDRIVE_<ENV>, rendered into the
  # HYPERDRIVE binding) and its pages query the migrated `products` table, and
  # a job resolves its secrets when it STARTS — so it waits on both,
  # `mode: enforced`, and the ids the applies lease-published are there. A pull
  # request deploys nothing, so nothing on one waits: every edge is advisory
  # there.
  dependsOn:
    - component: cloudflare-hyperdrive
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
    - component: db-migrate
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
  # The wiring documents the cloudflare-hyperdrive root lease-publishes, one
  # per deployed environment; tooling/wire/live.mjs picks this job's.
  secretEnv:
    WIRING_CLOUDFLARE_HYPERDRIVE_STAGE: "secret://algolia-search/algolia-search/stage/WIRING_CLOUDFLARE_HYPERDRIVE"
    WIRING_CLOUDFLARE_HYPERDRIVE_PROD: "secret://algolia-search/algolia-search/prod/WIRING_CLOUDFLARE_HYPERDRIVE"
  # Algolia, which the owner connects after the bootstrap: the application id
  # and its SEARCH-ONLY key, stored per environment as the product's secrets
  # ALGOLIA_APP_ID and ALGOLIA_SEARCH_API_KEY. They reach the Worker as
  # SECRETS at deploy (buildCommand below) and the home page reads them per
  # request (lib/algolia.ts) — never the build: the template inlined them into
  # the browser bundle at build time. Optional: one not stored yet is skipped
  # when the job resolves its secrets (no env var, no failure), and the page
  # then says search is not connected and lists the catalogue from Postgres.
  # The write/admin key is never needed: the connector indexes from Algolia's
  # dashboard.
  optionalSecretEnv:
    ALGOLIA_APP_ID: "secret://algolia-search/algolia-search/{{ .environment }}/ALGOLIA_APP_ID"
    ALGOLIA_SEARCH_API_KEY: "secret://algolia-search/algolia-search/{{ .environment }}/ALGOLIA_SEARCH_API_KEY"
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: algolia-search-web-{dev,stage,prod}.
    workerName: algolia-search-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    # wrangler.jsonc is COMMITTED — the fixture render, so the composition's
    # structure check (`test -f wrangler.jsonc`, before the build, in a fresh
    # checkout) passes. Stage and prod re-render it here, in their own job
    # tree, from this environment's wiring document, so the Worker binds the
    # real Hyperdrive config; dev verifies with the fixture and has no wiring.
    #
    # The site's public origin (metadataBase): the environment's SITE_URL when
    # intent.yaml sets one (a custom domain), else its workers.dev URL. The
    # subdomain is written out rather than read from ${WORKERS_DEV_SUBDOMAIN}:
    # the composition exports that to the smoke step only, so the build would
    # see it empty. ${ORUN_ENVIRONMENT} the runner sets for every step.
    #
    # The Algolia secrets are UNSET for the build (`env -u`), so no bundle can
    # carry them, and go to the Worker as SECRETS after it
    # (tooling/wire/worker-secrets.mjs: `wrangler secret bulk` over stdin; a
    # verify lane holds no Cloudflare credential and pushes nothing). A secret
    # changed later reaches the Worker on the next deploy.
    buildCommand: if [ "${ORUN_ENVIRONMENT}" != dev ]; then node ../../tooling/wire/live.mjs --template wrangler.template.jsonc --out wrangler.jsonc --components cloudflare-hyperdrive --env "${ORUN_ENVIRONMENT}"; fi && env -u ALGOLIA_APP_ID -u ALGOLIA_SEARCH_API_KEY NEXT_PUBLIC_SITE_URL="${SITE_URL:-https://algolia-search-web-${ORUN_ENVIRONMENT}.your-workers-subdomain.workers.dev}" pnpm exec turbo run build --filter=@app/web && node ../../tooling/wire/worker-secrets.mjs --secret ALGOLIA_APP_ID --secret ALGOLIA_SEARCH_API_KEY --worker "algolia-search-web-${ORUN_ENVIRONMENT}" --config wrangler.jsonc

    # Smoke: the home page renders its search section — `data-search=` is the
    # attribute the page writes around it in both states (InstantSearch when
    # the Algolia secrets are set, the catalogue read from Postgres when they
    # are not), not the site's name, which is the owner's to change and
    # HTML-escaped when it carries an `&` or `'` — and /api/health answers ok:
    # the database reachable and migrated. Each response is buffered before
    # grep so an early match cannot SIGPIPE curl.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q 'data-search=' && health=$(curl -sf \"${DEPLOYED_URL}/api/health\") && echo \"${health}\" | grep -q '\"ok\":true'"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
